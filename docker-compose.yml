services:
  app:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ivado-labs-assignment:runtime
    container_name: ivado-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"

  notebook:
    profiles:
      - notebook
    build:
      context: .
      dockerfile: Dockerfile
      target: notebook
    image: ivado-labs-assignment:notebook
    container_name: ivado-notebook
    restart: unless-stopped
    volumes:
      - ./notebooks:/app/notebooks
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8888:8888"

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: